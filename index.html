<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seobin's Gallery - Silver Wave Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Cinzel, Noto Serif KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gallery: {
                            50: '#f6f8fa',
                            100: '#edf1f5',
                            200: '#d5dce3',
                            300: '#b0bcc8',
                            400: '#8698a8',
                            500: '#627587',
                            600: '#4b5c6c',
                            700: '#3c4a57',
                            800: '#28333d',
                            900: '#171f26',
                            950: '#0d1217',
                            accent: '#8698a8'
                        }
                    },
                    fontFamily: {
                        serif: ['Cinzel', 'Noto Serif KR', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 50%, #d8e1ec 100%);
            color: #28333d;
            font-family: 'Cinzel', 'Noto Serif KR', serif;
            min-height: 100vh;
        }
        /* 실버 물결 그라데이션 및 효과 */
        .silver-wave-bg {
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.8) 0%, rgba(213, 220, 227, 0.5) 50%, rgba(176, 188, 200, 0.7) 100%);
            backdrop-filter: blur(12px);
        }
        .gallery-gradient-text {
            background: linear-gradient(135deg, #171f26 0%, #4b5c6c 50%, #8698a8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #edf1f5;
        }
        ::-webkit-scrollbar-thumb {
            background: #b0bcc8;
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8698a8;
        }
        .sold-out-stamp {
            border: 1.5px solid #ef4444;
            color: #ef4444;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transform: rotate(-10deg);
            background-color: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-gallery-300 selection:text-black pb-16 md:pb-0">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 silver-wave-bg border-b border-gallery-200 transition-all duration-300 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
            <!-- Logo -->
            <div class="cursor-pointer active:scale-95 transition-transform" onclick="resetView()">
                <h1 class="text-xl sm:text-2xl font-light tracking-[0.2em] gallery-gradient-text uppercase">Seobin's Gallery</h1>
                <p class="text-[9px] tracking-[0.25em] text-gallery-600 uppercase -mt-0.5">정서빈 Silver Wave Collection</p>
            </div>

            <!-- PC Actions -->
            <div class="hidden md:flex items-center gap-3">
                <button onclick="handleUploadClick()" class="flex items-center gap-2 px-4 py-2 text-xs uppercase tracking-widest border border-gallery-400 text-gallery-800 hover:bg-gallery-900 hover:text-white transition-all rounded-sm shadow-sm">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span>작품 등록</span>
                </button>
                
                <div id="userProfileArea" class="flex items-center gap-3">
                    <button id="authBtn" onclick="openAuthModal()" class="px-4 py-2 text-xs uppercase tracking-widest bg-gallery-900 border border-gallery-900 text-white hover:bg-gallery-800 transition-all rounded-sm shadow-sm">
                        로그인 / 가입
                    </button>
                </div>
            </div>
            
            <!-- Mobile Quick Buttons -->
            <div class="md:hidden flex items-center gap-2">
                <button onclick="handleUploadClick()" class="p-2 text-gallery-800 border border-gallery-400 rounded-sm active:bg-gallery-200 bg-white/50">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 md:py-12 flex-grow w-full space-y-12 md:space-y-16">

        <!-- Selected Highlights (1 col x 3 rows) - 고해상도 선명한 표시 적용 -->
        <section>
            <div class="flex items-center justify-between mb-4 md:mb-6">
                <h2 class="text-xs uppercase tracking-[0.25em] text-gallery-700 font-semibold flex items-center gap-2">
                    <span class="w-6 md:w-8 h-[1px] bg-gallery-500 inline-block"></span> Selected Highlights
                </h2>
                <span class="text-xs font-light text-gallery-600">주요 수작 콜렉션 (High-Res)</span>
            </div>

            <div id="mainHighlightsGrid" class="grid grid-cols-1 gap-6 max-w-4xl mx-auto">
                <!-- JS Dynamic Render -->
            </div>
        </section>

        <!-- Artist Profile & Statement -->
        <section id="artistBioSection" class="border-t border-gallery-300 pt-10">
            <div class="silver-wave-bg border border-gallery-300 p-6 md:p-8 rounded-sm relative overflow-hidden shadow-md">
                <div id="editBioBtnArea" class="absolute top-4 right-4">
                    <!-- Dynamic Edit Button for Seobin -->
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8 items-center">
                    <!-- Photo Frame with Fallback Image -->
                    <div class="flex justify-center">
                        <div class="relative w-44 h-44 sm:w-52 sm:h-52 rounded-full overflow-hidden border-2 border-gallery-400
